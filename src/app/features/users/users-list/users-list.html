<section class="users-list" aria-labelledby="users-title">
  <header class="users-list__header">
    <h1 id="users-title" class="users-list__title">Users</h1>
    <a mat-flat-button class="users-list__create" routerLink="/users/new">
      <mat-icon>person_add</mat-icon>
      <span>Create user</span>
    </a>
  </header>

  <mat-form-field class="users-list__search" appearance="outline" subscriptSizing="dynamic">
    <mat-label>Search users</mat-label>
    <input
      matInput
      [formControl]="searchControl"
      placeholder="Username, name or email"
      aria-label="Search users"
    />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <div class="users-list__table-wrapper">
    <table mat-table [dataSource]="dataSource" class="users-list__table" aria-label="Users table">
      <!-- Username -->
      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef>Username</th>
        <td mat-cell *matCellDef="let user">{{ user.username }}</td>
      </ng-container>

      <!-- Name -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let user">{{ user.name }}</td>
      </ng-container>

      <!-- Surnames -->
      <ng-container matColumnDef="surnames">
        <th mat-header-cell *matHeaderCellDef>Surnames</th>
        <td mat-cell *matCellDef="let user">{{ user.surnames }}</td>
      </ng-container>

      <!-- Email -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>

      <!-- Age -->
      <ng-container matColumnDef="age">
        <th mat-header-cell *matHeaderCellDef>Age</th>
        <td mat-cell *matCellDef="let user">{{ user.age }}</td>
      </ng-container>

      <!-- Active -->
      <ng-container matColumnDef="active">
        <th mat-header-cell *matHeaderCellDef>Active</th>
        <td mat-cell *matCellDef="let user">
          <mat-icon
            class="users-list__status-icon"
            [class.users-list__status-icon--active]="user.active"
            [class.users-list__status-icon--inactive]="!user.active"
            [attr.aria-label]="user.active ? 'Active' : 'Inactive'"
          >
            {{ user.active ? 'check_circle' : 'cancel' }}
          </mat-icon>
        </td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef aria-label="Actions"></th>
        <td mat-cell *matCellDef="let user" class="users-list__actions-cell">
          <a mat-icon-button [routerLink]="['/users', user.id, 'edit']" [attr.aria-label]="'Edit ' + user.username">
            <mat-icon>edit</mat-icon>
          </a>
          <button
            mat-icon-button
            (click)="confirmDelete(user)"
            [disabled]="deletingId() === user.id"
            [attr.aria-label]="'Delete ' + user.username"
            [attr.aria-busy]="deletingId() === user.id"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell users-list__empty" [attr.colspan]="displayedColumns.length">
          No users found for "{{ searchControl.value }}"
        </td>
      </tr>
    </table>

    <mat-paginator
      class="users-list__paginator"
      [pageSize]="10"
      [pageSizeOptions]="[10]"
      [hidePageSize]="true"
      showFirstLastButtons
      aria-label="Users pagination"
    ></mat-paginator>
  </div>
</section>
