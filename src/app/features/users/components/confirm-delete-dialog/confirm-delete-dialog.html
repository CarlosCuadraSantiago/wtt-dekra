<div class="confirm-delete" role="dialog" aria-labelledby="delete-title" aria-describedby="delete-desc">
  <div class="confirm-delete__header">
    <mat-icon class="confirm-delete__icon" aria-hidden="true">warning</mat-icon>
    <h2 id="delete-title" class="confirm-delete__title" mat-dialog-title>Delete user</h2>
  </div>

  <mat-dialog-content class="confirm-delete__content">
    <p id="delete-desc" class="confirm-delete__desc">
      Are you sure you want to delete <strong>{{ data.user.username }}</strong
      >?
    </p>
    <p class="confirm-delete__hint">This action cannot be undone. Email: {{ data.user.email }}</p>
  </mat-dialog-content>

  <mat-dialog-actions class="confirm-delete__actions" align="end">
    <button matButton type="button" (click)="close(false)">Cancel</button>
    <button matButton="filled" type="button" class="confirm-delete__confirm" (click)="close(true)" [attr.aria-label]="'Confirm delete ' + data.user.username">
      Delete
    </button>
  </mat-dialog-actions>
</div>
