<section class="users-create" aria-labelledby="create-title">
  <header class="users-create__header">
    <a mat-icon-button routerLink="/users" aria-label="Back to users list">
      <mat-icon>arrow_back</mat-icon>
    </a>
    <h1 id="create-title" class="users-create__title">Create user</h1>
  </header>

  <div class="users-create__layout">
    <mat-card class="users-create__card" appearance="outlined">
      <mat-card-content>
        <app-user-form submitLabel="Create user" (submitted)="onSubmit($event)" (valueChange)="onValueChange($event)" />
      </mat-card-content>
    </mat-card>

    <aside class="users-create__preview" aria-label="Live preview" aria-live="polite">
      <h2 class="users-create__preview-title">Preview</h2>
      <app-user-card [user]="previewUser()" mode="preview" />
      <p class="users-create__preview-hint">Live preview updates as you type</p>
    </aside>
  </div>
</section>
