<div class="layout" [class.layout--dark]="isDarkMode()" *transloco="let t">
  <header class="layout__navbar" role="banner">
    <div class="layout__navbar-left">
      @if (!isDesktop()) {
        <button
          mat-icon-button
          class="layout__menu-button"
          [attr.aria-label]="t('layout.navbar.toggleMenu')"
          (click)="toggleSidebar()"
        >
          <mat-icon>menu</mat-icon>
        </button>
      }
    </div>

    <div class="layout__navbar-center">
      <img class="layout__logo" ngSrc="dekra.svg" alt="Dekra" width="145" height="40" priority />
    </div>

    <div class="layout__navbar-right">
      <div class="layout__controls">
        <button
          class="layout__lang-trigger"
          [matMenuTriggerFor]="langMenu"
          [attr.aria-label]="t('layout.navbar.changeLanguage')"
          aria-haspopup="menu"
          type="button"
        >
          <img class="layout__flag" [ngSrc]="langFlagSrc()" [alt]="langFlagAlt()" width="30" height="20" />
          <span class="layout__lang-label">{{ langLabel() }}</span>
        </button>
        <mat-menu #langMenu="matMenu" panelClass="layout__lang-menu" xPosition="before">
          <button mat-menu-item (click)="setLang('en')" [class.layout__lang-active]="activeLang() === 'en'">
            <span class="layout__option">
              <img class="layout__flag layout__flag--menu" ngSrc="flags/gb.svg" alt="United Kingdom" width="30" height="20" />
              <span>English</span>
            </span>
          </button>
          <button mat-menu-item (click)="setLang('es')" [class.layout__lang-active]="activeLang() === 'es'">
            <span class="layout__option">
              <img class="layout__flag layout__flag--menu" ngSrc="flags/es.svg" alt="España" width="30" height="20" />
              <span>Español</span>
            </span>
          </button>
        </mat-menu>

        <button
          mat-icon-button
          class="layout__theme-toggle"
          [attr.aria-label]="isDarkMode() ? t('layout.navbar.switchToDark') : t('layout.navbar.switchToLight')"
          [attr.aria-pressed]="isDarkMode()"
          (click)="toggleTheme()"
        >
          <mat-icon>{{ isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>
      </div>
    </div>
  </header>

  <div class="layout__body">
    <mat-sidenav-container class="layout__container">
      <mat-sidenav
        class="layout__sidebar"
        [mode]="isDesktop() ? 'side' : 'over'"
        [opened]="sidebarOpened()"
        (closedStart)="sidebarOpened.set(false)"
      >
        <nav class="layout__nav" aria-label="Main navigation">
          <a
            class="layout__nav-item"
            routerLink="/users"
            routerLinkActive="layout__nav-item--active"
            (click)="!isDesktop() && toggleSidebar()"
            [attr.aria-label]="t('layout.nav.usersManagement')"
          >
            <mat-icon class="layout__nav-icon">group</mat-icon>
            <span>{{ t('layout.nav.usersManagement') }}</span>
          </a>
        </nav>
      </mat-sidenav>

      <mat-sidenav-content class="layout__main">
        <main class="layout__content">
          <router-outlet />
        </main>
      </mat-sidenav-content>
    </mat-sidenav-container>
  </div>
</div>
